<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141613" />
    <!-- Apply the saved theme before first paint (key must match THEME_STORAGE_KEY). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cospace-theme');
          var d =
            t === 'dark' ||
            ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.classList.toggle('dark', d);
          r.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <title>Co-Space Working | Co-Workspace Booking</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
