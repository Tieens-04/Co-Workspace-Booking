version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cospace-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-cospace_db}
      MYSQL_USER: ${DB_USER:-cospace_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Loopback only: reachable by local admin/backup tools, never from other hosts.
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP, not the socket: on first boot the init server runs with networking disabled, and a
      # socket ping would report healthy before the server can accept connections from `db:3306`.
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p$${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cospace-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: cospace-server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # exec makes Node PID 1 so SIGTERM reaches the graceful shutdown handler.
    command: sh -c "npm run db:deploy && exec node dist/server.js"
    # Longer than SHUTDOWN_TIMEOUT_MS so in-flight requests and emails can drain.
    stop_grace_period: 30s
    environment:
      PORT: 5000
      NODE_ENV: production
      # Exactly one Nginx hop; do not publish the backend port to the host.
      TRUST_PROXY: 'true'
      DATABASE_URL: mysql://${DB_USER:-cospace_user}:${DB_PASSWORD}@db:3306/${DB_NAME:-cospace_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-20000}
      BOOKING_MAX_ADVANCE_DAYS: ${BOOKING_MAX_ADVANCE_DAYS:-60}
      BOOKING_MAX_ACTIVE_PER_CUSTOMER: ${BOOKING_MAX_ACTIVE_PER_CUSTOMER:-5}
      BOOKING_REMINDER_HOURS: ${BOOKING_REMINDER_HOURS:-2}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SMTP_HOST: ${SMTP_HOST-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT-587}
      SMTP_SECURE: ${SMTP_SECURE-false}
      SMTP_USER: ${SMTP_USER:-${GMAIL_USER:-}}
      SMTP_PASS: ${SMTP_PASS:-${GMAIL_APP_PASSWORD:-}}
      SMTP_FROM: ${SMTP_FROM:-${EMAIL_FROM:-"Co-Space Working" <no-reply@co-space.local>}}
    healthcheck:
      # Readiness: fails when the database is unreachable or the process is draining.
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cospace-network

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: cospace-client
    restart: always
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${CLIENT_PORT:-80}:80'
    healthcheck:
      # 127.0.0.1, not localhost: in this image localhost resolves to ::1 but nginx listens on IPv4.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cospace-network

volumes:
  mysql_data:
    driver: local

networks:
  cospace-network:
    driver: bridge
