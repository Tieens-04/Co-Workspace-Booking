name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          # Disposable credentials scoped to this service; no real infrastructure access.
          MYSQL_ROOT_PASSWORD: ci-disposable-root
          MYSQL_DATABASE: cospace_ci_test
          MYSQL_USER: cospace_ci
          MYSQL_PASSWORD: ci-disposable-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: mysql://cospace_ci:ci-disposable-password@127.0.0.1:3306/cospace_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm and verify toolchain
        run: |
          npm install --global npm@11.11.0
          node --version
          npm --version
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "npm@$(npm --version)" = "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit
      - name: Tooling security regressions
        run: npm run test:tooling
      - name: Generate and validate Prisma
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          npm run db:generate --workspace=apps/server
          npm exec --workspace=apps/server -- prisma validate
      - name: Validate test database and deploy migrations
        run: npm run db:deploy:test --workspace=apps/server
      - run: npm run lint
      - run: npm run typecheck
      - name: Frontend unit tests
        run: npm run test --workspace=apps/client -- --reporter=default --reporter=junit --outputFile=../../reports/client.xml
      - name: Backend unit tests
        run: npm run test --workspace=apps/server -- --reporter=default --reporter=junit --outputFile=../../reports/server.xml
      - name: MySQL integration tests
        run: npm run test:integration --workspace=apps/server -- --reporter=default --reporter=junit --outputFile=../../reports/integration.xml
      - name: Production builds
        run: npm run build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/*.xml
          retention-days: 14
          if-no-files-found: warn

  browser-e2e:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-disposable-root
          MYSQL_DATABASE: cospace_e2e_test
          MYSQL_USER: cospace_e2e
          MYSQL_PASSWORD: e2e-disposable-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: mysql://cospace_e2e:e2e-disposable-password@127.0.0.1:3306/cospace_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm and verify toolchain
        run: |
          npm install --global npm@11.11.0
          node --version
          npm --version
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "npm@$(npm --version)" = "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - name: Generate browser fixture Prisma client
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:generate --workspace=apps/server
      - run: npx playwright install --with-deps chromium
      - run: npm run lint:e2e
      - run: npm run typecheck:e2e
      - name: Browser environment safety tests
        run: node --import tsx --test e2e/env.test.ts
      - name: Customer and admin browser journeys
        run: npm run test:e2e
      - name: Repeat concurrent booking regression
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/e2e-concurrency.xml
        run: npm run test:e2e -- --grep "two customer browsers race" --project=desktop --repeat-each=10 --output=test-results-concurrency --reporter=list,junit
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: |
            reports/e2e*.xml
            playwright-report/
            test-results/
            test-results-concurrency/
          retention-days: 14
          if-no-files-found: warn

  docker-build:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production images without cache
        run: |
          docker build --pull --no-cache -f apps/server/Dockerfile -t cospace-server:cwb-50 .
          docker build --pull --no-cache -f apps/client/Dockerfile -t cospace-client:cwb-50 .
      - name: Verify server runtime toolchain
        run: |
          docker run --rm --entrypoint node cospace-server:cwb-50 --version
          docker run --rm --entrypoint npm cospace-server:cwb-50 --version
          test "$(docker run --rm --entrypoint node cospace-server:cwb-50 --version)" = "v$(cat .nvmrc)"
          test "$(docker run --rm --entrypoint npm cospace-server:cwb-50 --version)" = "11.11.0"
      - name: Verify frontend build artifact
        run: docker run --rm --entrypoint sh cospace-client:cwb-50 -c 'test -s /usr/share/nginx/html/index.html'
